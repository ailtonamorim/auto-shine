<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoShine — Lava Jato</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/integracao.css" />
  <script src="assets/js/tema.js"></script>
  <script src="assets/js/menu-perfil.js"></script>
</head>
<body data-page="perfil">
  <div class="bg-decor"></div>
  <header class="topbar container">
    <a class="logo" href="index.html">LavaJá</a>
    <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <nav class="main-nav">
      <a href="index.html">Início</a>
      <a href="servicos.html">Serviços</a>
      <a href="favoritos.html" id="link-favoritos" class="hidden">Favoritos</a>
      <a href="mapa.html">Mapa</a>
      <a href="meus-agendamentos.html" id="link-agendamentos" class="hidden">Agendamentos</a>
      
    </nav>
    <a
    href="cadastro.html?mode=login"
    class="btn btn-primary btn-acessar header-access"
    id="btn-acessar"
  >
    Acessar
  </a>
  </header>

  <main class="container reveal-root">
    <section class="profile-hero reveal-item">
      <div class="profile-carousel" aria-label="Imagens da loja">
        <div class="profile-carousel-track">
          <img class="profile-carousel-slide is-active" src="assets/img/detalhe-premium-estetica.png" alt="Capa do estabelecimento" />
        </div>
      </div>
      <div class="profile-info">
        <h1>Selecione um lava jato</h1>
        <p>Escolha um estabelecimento pela home ou pelo mapa para ver serviços, preços e avaliações reais.</p>
        <a class="btn btn-ghost" href="servicos.html">Ver lava jatos</a>
      </div>
    </section>

    <section class="profile-details-grid reveal-item" id="profile-details"></section>

    <section class="reveal-item">
      <div class="section-head">
        <h2>Serviços e preços</h2>
        <a href="index.html" class="link">Escolher lava jato</a>
      </div>

      <div class="services-grid"></div>
    </section>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
