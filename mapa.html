<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LavaJá — Mapa</title>

  <!-- Importação do Mapa Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- IMPORTANTE: Importação das fontes Anton e Montserrat adicionada aqui! -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/integracao.css" />
  <script src="assets/js/tema.js"></script>
  <script src="assets/js/menu-perfil.js"></script>
</head>

<body data-page="mapa">

  <div class="bg-decor"></div>

  <header class="topbar container">
  <a class="logo" href="index.html" aria-label="LavaJá - página inicial">
    LavaJá
  </a>

  <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
  </button>

  <nav class="main-nav" id="main-nav">
    <a href="index.html">Início</a>

    <a href="servicos.html">Serviços</a>

    <a href="favoritos.html" id="link-favoritos" class="hidden">
      Favoritos
    </a>

    <a href="mapa.html" class="active" aria-current="page">
      Mapa
    </a>

    <a href="meus-agendamentos.html" id="link-agendamentos" class="hidden">
      Agendamentos
    </a>
  </nav>

  <a href="cadastro.html?mode=login" class="btn btn-primary btn-acessar header-access" id="btn-acessar"
  >
    Acessar
  </a>
</header>

  <main class="container page-map reveal-root">

    <section class="section-head reveal-item">
      <h1>Lava jatos perto de você</h1>
    </section>

    <section class="chip-list reveal-item" id="map-filter-list">

      <button class="chip active" data-filter="todos">Todos</button>
      <button class="chip" data-filter="lavagem">Lavagem</button>
      <button class="chip" data-filter="polimento">Polimento</button>
      <button class="chip" data-filter="higienização">Higienização</button>
      <button class="chip" data-filter="detalhamento">Detalhamento</button>
      <button class="btn btn-ghost" id="map-locate-btn" type="button">Localização</button>

    </section>

    <section class="map-shell reveal-item">

      <div id="map" class="map-canvas real-map" aria-label="Mapa com lava jatos próximos"></div>

      <article class="map-bottom-card" id="map-selected-card">
        <h3 id="shop-name">Selecione um lava jato</h3>
        <p id="shop-info">Clique em um marcador no mapa</p>
        <div class="map-action-row">
          <a id="map-profile-btn" class="btn btn-primary" href="perfil.html">Ver serviços</a>
          <button id="map-route-btn" class="btn btn-secondary" type="button">Caminho</button>
          <a id="external-nav-btn" class="btn btn-ghost" href="https://www.google.com/maps" target="_blank" rel="noopener">Ir com GPS</a>
        </div>
      </article>

    </section>

  </main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/js/app.js"></script>

</body>
</html>
